  - id: noidonne-immobiliare
    name: NoiDonneImmobiliare.eu
    kind: agenzia
    website: https://noidonneimmobiliare.eu/
    adapter: a_wp
    delay: 1.0
    start_urls:
      - https://noidonneimmobiliare.eu/status/vendita/
    page_template: 'https://noidonneimmobiliare.eu/status/vendita/page/{n}/'
    max_pages: 2
    link_regex: 'noidonneimmobiliare\.eu/property/[^/]+/?$'

  - id: casa-con-giardino
    name: Casa con Giardino - di Martina Micalizzi
    kind: agenzia
    website: https://www.casacongiardino.eu/
    adapter: a_wpjson
    delay: 1.0
    # 162 immobili hanno il tag property_status=vendita, ma quasi tutti sono vecchi annunci mai spostati
    # in archivio (tassonomia property_type 'archiviati', 173 voci): il termine property_type
    # 'quanto-ancora-disponibile' ("Tutti gli immobili", 13 voci) e' quello davvero aggiornato.
    api: https://www.casacongiardino.eu/wp-json/wp/v2/properties
    params:
      property_type: 71

  - id: calcara-immobiliare
    name: Agenzia Immobiliare CALCARA
    kind: agenzia
    website: https://www.calcara.it/
    adapter: a_wp
    delay: 1.0
