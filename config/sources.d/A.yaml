  - id: unopiu-immobiliare
    name: Unopiù Immobiliare di Rita Giancristofaro
    kind: agenzia
    website: https://www.unopiuimmobiliare.it/
    adapter: a_wp
    delay: 1.0
    # agenzia con sede in Trieste; le 3 schede citano solo vie (Moreri/Stuparich/dell'Istria) senza mai
    # nominare il comune ne' un rione della lista sicura, ma nessun indizio di immobili fuori provincia.
    town: Trieste
    start_urls:
      - https://www.unopiuimmobiliare.it/immobili/?wpv-wpcf-contratto=Vendita
    link_regex: 'unopiuimmobiliare\.it/immobile/[^/]+/?$'

