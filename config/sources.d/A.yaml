    page_template: 'https://www.calcara.it/property-status/vendita/page/{n}/'
    max_pages: 6
    link_regex: 'calcara\.it/property/[^/]+/?$'

  - id: athouse-immobiliare
    name: atHOUSE Immobiliare
    kind: agenzia
    website: https://athouse.it/
    adapter: a_sitemap
    delay: 1.0
    sitemap: https://athouse.it/immobile-sitemap.xml
    link_regex: '/immobile/[a-z0-9-]+/?$'
    exclude_regex: 'affitto'

  - id: tag-srl
    name: Tag srl
    kind: agenzia
    website: https://affittoappartamentitrieste.it/
    adapter: a_wp
    delay: 1.0
    # town di default: l'elenco vendita e' https://.../vendita-appartamenti-trieste/ (solo Trieste
    # città, nessun indizio di immobili fuori provincia in questo elenco) e le schede non riportano il
    # comune in un campo riconoscibile (via Ghega, via Santi Martiri, ecc. non sono nell'elenco zone).
    town: Trieste
    start_urls:
      - https://affittoappartamentitrieste.it/vendita-appartamenti-trieste/
    link_regex: 'affittoappartamentitrieste\.it/properties/[^/]+/?$'

  - id: minimal-re
    name: Minimal Re Srl
    kind: agenzia
    website: https://www.minimalre.it/
    adapter: a_wp
    delay: 1.0
    start_urls:
      - https://www.minimalre.it/vendite-residenziali/
      - https://www.minimalre.it/vendite-commerciali/
    link_regex: 'minimalre\.it/vendite-(?:residenziali|commerciali)/[a-z0-9-]+/?$'

