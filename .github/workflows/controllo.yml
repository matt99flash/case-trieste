name: Controllo annunci

on:
  schedule:
    # ogni 2 ore dalle 7 alle 23 (ora italiana); gli orari di GitHub sono in UTC
    - cron: "7 5-21/2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: controllo-annunci
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa
        run: pip install -r requirements.txt

      - name: Leggi tutte le fonti
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python -m scraper.run --workers 16

      - name: Salva i dati aggiornati
        run: |
          git config user.name "case-trieste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then echo "Nessuna modifica"; exit 0; fi
          git commit -q -m "Annunci aggiornati $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull -q --rebase && git push -q
