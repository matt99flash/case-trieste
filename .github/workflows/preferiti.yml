name: Salva preferiti

# La dashboard apre una issue "Preferiti ..." con l'elenco dei preferiti (codici brevi).
# Viene accettata solo se aperta dal proprietario del progetto.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: controllo-annunci
  cancel-in-progress: false

jobs:
  salva:
    if: startsWith(github.event.issue.title, 'Preferiti') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Applica
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -m scraper.favorites > esito.txt
          cat esito.txt

      - name: Salva
        run: |
          git config user.name "case-trieste-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/favorites.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Preferiti aggiornati"
            git pull -q --rebase && git push -q
          fi

      - name: Chiudi la richiesta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --comment "✅ $(tail -1 esito.txt) Tra pochi minuti li vedi su tutti i dispositivi collegati. Puoi chiudere questa pagina."

  ignora:
    if: startsWith(github.event.issue.title, 'Preferiti') && github.event.issue.user.login != github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason "not planned"
